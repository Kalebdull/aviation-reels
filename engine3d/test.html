<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script></head>
<body><script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
const W = 1080, H = 1920;
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(W, H); r.setPixelRatio(1); r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
r.shadowMap.enabled = true; r.shadowMap.type = THREE.VSMShadowMap; r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.environment = new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(), 0.04).texture;
scene.fog = new THREE.Fog('#bfe3ff', 60, 260);
// sky gradient
const sky = new THREE.Mesh(new THREE.SphereGeometry(500, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color('#3f9df0') }, bot: { value: new THREE.Color('#d9f1ff') } },
  vertexShader: 'varying vec3 p; void main(){ p = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 bot; varying vec3 p; void main(){ gl_FragColor = vec4(mix(bot, top, smoothstep(-0.05, 0.6, p.y)), 1.); }' }));
scene.add(sky);
const hemi = new THREE.HemisphereLight('#cfeaff', '#6aa35a', 1.4); scene.add(hemi);
const sun = new THREE.DirectionalLight('#fff2d6', 3.2); sun.position.set(30, 50, 25); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.radius = 8; sun.shadow.blurSamples = 16;
Object.assign(sun.shadow.camera, { left: -40, right: 40, top: 40, bottom: -40, near: 1, far: 150 }); scene.add(sun);
// rolling hills
const gg = new THREE.PlaneGeometry(600, 600, 160, 160); gg.rotateX(-Math.PI / 2);
const pos = gg.attributes.position; for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), z = pos.getZ(i); pos.setY(i, 3 * Math.sin(x * 0.05) * Math.cos(z * 0.04) + 1.5 * Math.sin(x * 0.11 + 2) - 6); }
gg.computeVertexNormals();
const ground = new THREE.Mesh(gg, new THREE.MeshStandardMaterial({ color: '#7cc46a', roughness: 0.95 })); ground.receiveShadow = true; scene.add(ground);
// trees: lollipops
const trunk = new THREE.MeshStandardMaterial({ color: '#8a5a3c', roughness: 0.9 }), leaf = new THREE.MeshStandardMaterial({ color: '#4fa35a', roughness: 0.8 });
for (let i = 0; i < 40; i++) { const x = (Math.sin(i * 12.9898) * 43758.5453 % 1) * 120 - 60, z = -20 - (Math.sin(i * 78.233) * 12345.678 % 1 + 1) * 60;
  const t = new THREE.Group(); const a = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.5, 3, 12), trunk); a.position.y = 1.5; const b = new THREE.Mesh(new THREE.SphereGeometry(2.2, 24, 16), leaf); b.position.y = 4.2;
  a.castShadow = b.castShadow = true; t.add(a, b); t.position.set(x, -6 + 3 * Math.sin(x * 0.05) * Math.cos(z * 0.04) + 1.5 * Math.sin(x * 0.11 + 2), z); scene.add(t); }
// clouds: clusters of spheres
const cm = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 1, emissive: '#dfefff', emissiveIntensity: 0.25 });
for (let i = 0; i < 8; i++) { const c = new THREE.Group(); for (let k = 0; k < 6; k++) { const s = new THREE.Mesh(new THREE.SphereGeometry(2 + (k % 3), 24, 16), cm); s.position.set(k * 2.2 - 5, Math.sin(k) * 1.2, (k % 2) * 1.5); c.add(s); }
  c.position.set(-60 + i * 18, 14 + (i % 3) * 5, -60 - (i % 4) * 25); scene.add(c); }
// the mascot plane: chubby, rounded, glossy
const plane = new THREE.Group();
const paint = new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.2 });
const blue = new THREE.MeshPhysicalMaterial({ color: '#2f6bff', roughness: 0.35, clearcoat: 1 });
const coral = new THREE.MeshPhysicalMaterial({ color: '#ff6a5c', roughness: 0.4, clearcoat: 1 });
const glass = new THREE.MeshPhysicalMaterial({ color: '#2a4c86', roughness: 0.05, metalness: 0.1, clearcoat: 1 });
const prof = []; for (let i = 0; i <= 24; i++) { const u = i / 24; prof.push(new THREE.Vector2(Math.max(0.001, Math.sin(Math.PI * Math.pow(u, 0.8)) * (1.25 - 0.55 * u)), u * 7 - 3.2)); }
const body = new THREE.Mesh(new THREE.LatheGeometry(prof, 48), paint); body.rotation.z = Math.PI / 2; body.scale.set(1, 1, 1); plane.add(body);
const stripe = new THREE.Mesh(new THREE.TorusGeometry(1.07, 0.09, 12, 48), blue); stripe.rotation.y = Math.PI / 2; stripe.position.x = 0.3; plane.add(stripe);
const wing = new THREE.Mesh(new THREE.CapsuleGeometry(0.28, 9, 8, 24), paint); wing.rotation.x = Math.PI / 2; wing.scale.set(2.6, 1, 0.35); wing.position.set(0.6, 1.15, 0); plane.add(wing);
const tipL = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 12), coral); tipL.position.set(0.6, 1.15, 4.75); const tipR = tipL.clone(); tipR.position.z = -4.75; plane.add(tipL, tipR);
const tail = new THREE.Mesh(new THREE.CapsuleGeometry(0.2, 1.4, 8, 16), blue); tail.position.set(-3.1, 1.0, 0); tail.rotation.z = -0.5; tail.scale.set(2.4, 1, 0.5); plane.add(tail);
const stab = new THREE.Mesh(new THREE.CapsuleGeometry(0.16, 3, 8, 16), paint); stab.rotation.x = Math.PI / 2; stab.scale.set(2.4, 1, 0.4); stab.position.set(-3.2, 0.25, 0); plane.add(stab);
const wind = new THREE.Mesh(new THREE.SphereGeometry(1.0, 32, 24, 0, Math.PI * 2, 0, Math.PI / 2), glass); wind.position.set(1.4, 0.5, 0); wind.scale.set(1.1, 0.75, 0.95); plane.add(wind);
const eyeW = new THREE.MeshPhysicalMaterial({ color: '#ffffff', roughness: 0.2, clearcoat: 1 }), eyeB = new THREE.MeshStandardMaterial({ color: '#16213f', roughness: 0.3 });
for (const z of [0.42, -0.42]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 16), eyeW); e.position.set(2.15, 0.78, z); e.scale.set(0.5, 1, 1); const p = new THREE.Mesh(new THREE.SphereGeometry(0.17, 16, 12), eyeB); p.position.set(2.3, 0.78, z * 0.95); plane.add(e, p); }
const spin = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.8, 24), coral); spin.rotation.z = -Math.PI / 2; spin.position.x = 3.95; plane.add(spin);
const disc = new THREE.Mesh(new THREE.CircleGeometry(1.6, 48), new THREE.MeshBasicMaterial({ color: '#9fb0c8', transparent: true, opacity: 0.18, side: THREE.DoubleSide })); disc.rotation.y = Math.PI / 2; disc.position.x = 3.9; plane.add(disc);
const wheelM = new THREE.MeshStandardMaterial({ color: '#2a3150', roughness: 0.6 });
for (const z of [1, -1]) { const w = new THREE.Mesh(new THREE.TorusGeometry(0.32, 0.18, 12, 24), wheelM); w.position.set(0.4, -1.25, z); plane.add(w); }
plane.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(plane);
const cam = new THREE.PerspectiveCamera(32, W / H, 0.1, 1000);
window.seek = t => {
  plane.position.set(0, 2 + Math.sin(t * 1.3) * 0.25, 0); plane.rotation.set(Math.sin(t * 0.9) * 0.08, 0.5, Math.sin(t * 1.1) * 0.04);
  disc.rotation.x = t * 40;
  cam.position.set(9 + Math.sin(t * 0.3) * 1.5, 4.2, 15); cam.lookAt(0, 2.2, 0);
  r.render(scene, cam);
};
window.seek(0); window.READY = true;
</script></body></html>
